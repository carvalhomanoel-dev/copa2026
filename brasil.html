<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>brasil</title>
    <link rel="stylesheet" href="estilo.css">
</head>

<body>
    <h1>copa 2026</h1>
    <nav>
        <ul>
            <li>
                <a href="index.html">inicio</a>
            </li>
        </ul>
    </nav>

    <h2>jogadores do brasil</h2>
    <form action="#" method="get">
        <fieldset>
            <legend>
                buscar
            </legend>
            <input type="text" placeholder="digite o nome do jogador" name="jogador">
            <select name="posiçao">
                <option value="1">goleiro</option>
                <option value="2">meia meia-atacante</option>
                <option value="3">ponta esquerda</option>
                <option value="4">atacante</option>
            </select>
            <input type="submit" value="buscar">
        </fieldset>
    </form>
    <table>
        <tbody>
            <tr>
                <td class="jogador-img">
                    <img src="./imgs/brasil/vinijr.jfif" alt="">
                </td>
                <td class="jogador-pos">
                    ponta esquerda
                </td>
                <td class="jogador-nome">
                    vini jr
                </td>
            </tr>
            <tr>
                <td class="jogador-img">
                    <img src="./imgs/brasil/ederson.jfif" alt="">
                </td>

                <td class="jogador-pos">
                    goleiro
                </td>
                <td class="jogador-nome">
                    Ederson
                </td>
            </tr>

            <tr>
                <td class="jogador-img">
                    <img src="./imgs/brasil/endrick.jfif" alt="">
                </td>
                <td class="jogador-pos">
                    atacante
                </td>
                <td class="jogador-nome">
                    endrick
                </td>
            </tr>
            <tr>
                <td class="jogador-img">
                    <img src="./imgs/brasil/neymar.jfif" alt="">
                </td>
                <td class="jogador-pos">
                    meia-atacante
                </td>
                <td class="jogador-nome">
                    neymar
                </td>
            </tr>

           

        </tbody>
    </table>
</body>

</html>
